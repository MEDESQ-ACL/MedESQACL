[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medesq-anonymous"
version = "0.1.0"
description = "Anonymous reproducibility package for MedESQ and RACE-ESQ experiments."
requires-python = ">=3.10"
authors = [{name = "Anonymous Authors"}]
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.0.0"]
es = ["elasticsearch>=8.13.0"]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
